[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-platform"
version = "0.1.0"
description = "Self-healing data migration intelligence platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "pandas>=2.0.3",
  "scikit-learn>=1.3.2",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
